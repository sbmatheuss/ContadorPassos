<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Passos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    form {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    input {
      margin: 10px;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    button {
      background-color: #00ff88;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background-color: #00cc6a;
    }

    #resultado {
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
    <form>
      
      <h1>🔢 Contador de Passos</h1>
      <p>
        Início: <input type="number" id="inicio">
        Fim: <input type="number" id="fim">
        <button id="contar">Contar</button>
      </p>
      <div id="resultado">Digite os números e clique em contar!</div>
    </form>
  

    <script src="script.js"></script>
    
    
</body>
</html>
